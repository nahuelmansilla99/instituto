<div class="auth-page">
  <div class="auth-card glass-card animate-fade-in">
    <!-- Header -->
    <div class="auth-header">
      <div class="auth-logo-badge">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
      </div>
      <h2>Iniciar Sesión</h2>
      <p>Ingresa a tu cuenta de estudiante para continuar tus clases</p>
    </div>

    <!-- Error Alert -->
    <div *ngIf="errorMessage()" class="alert-error animate-fade-in">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>{{ errorMessage() }}</span>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Google Sign-In Button -->
      <div class="google-btn-container" style="display: flex; justify-content: center; margin-bottom: 1.5rem;">
        <asl-google-signin-button type="standard" size="large"></asl-google-signin-button>
      </div>

      <div class="divider" style="display: flex; align-items: center; text-align: center; margin-bottom: 1.5rem; color: #666;">
        <hr style="flex: 1; border: none; border-top: 1px solid #ddd; margin-right: 0.5rem;" />
        <span>o usa tu email</span>
        <hr style="flex: 1; border: none; border-top: 1px solid #ddd; margin-left: 0.5rem;" />
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Correo Electrónico</label>
        <input
          id="email"
          type="email"
          class="form-control"
          placeholder="tu.email@gmail.com"
          formControlName="email"
        />
        <div *ngIf="isFieldInvalid('email')" class="form-error">
          Ingresa un correo electrónico válido
        </div>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
          <label class="form-label" for="password" style="margin-bottom: 0;">Contraseña</label>
        </div>
        <div style="position: relative; display: flex; align-items: center;">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            class="form-control"
            placeholder="••••••••"
            formControlName="password"
            style="padding-right: 2.5rem;"
          />
          <button type="button" (click)="togglePasswordVisibility()" style="position: absolute; right: 0.5rem; background: none; border: none; cursor: pointer; color: #666; display: flex;">
            <svg *ngIf="!showPassword()" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg *ngIf="showPassword()" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path><line x1="2" y1="2" x2="22" y2="22"></line></svg>
          </button>
        </div>
        <div *ngIf="isFieldInvalid('password')" class="form-error">
          La contraseña es obligatoria
        </div>
      </div>

      <button
        type="submit"
        class="btn btn-primary w-full"
        [disabled]="loginForm.invalid || isLoading()"
      >
        <span *ngIf="isLoading()" class="spinner"></span>
        <span>{{ isLoading() ? 'Iniciando sesión...' : 'Entrar a la Plataforma' }}</span>
      </button>
    </form>

    <!-- Footer -->
    <div class="auth-footer">
      <span>¿No tienes una cuenta aún?</span>
      <a routerLink="/register" class="auth-link">Regístrate aquí</a>
    </div>
  </div>
</div>
