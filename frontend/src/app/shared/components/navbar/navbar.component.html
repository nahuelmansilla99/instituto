<header class="navbar-wrapper">
  <div class="navbar-container">
    <!-- Logo -->
    <a routerLink="/dashboard" class="brand-logo">
      <div class="logo-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-title">Taller<span class="gradient-text">Flexible</span></span>
      </div>
    </a>

    <!-- Right Side Nav -->
    <div class="nav-actions" *ngIf="authService.currentUser() as user">
      <!-- User Profile & Dropdown -->
      <div class="user-menu-container">
        <button class="user-chip" (click)="toggleDropdown()" [class.active]="isDropdownOpen">
          <div class="avatar-circle">
            {{ getInitials(user.name) }}
          </div>
          <div class="user-info">
            <span class="user-name">{{ user.name }}</span>
            <span class="user-role">{{ user.role === 'SYSADMIN' ? 'Sysadmin' : (user.role === 'ADMIN' ? 'Profesor' : 'Alumno') }}</span>
          </div>
          <svg class="chevron-icon" [class.rotated]="isDropdownOpen" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>

        <!-- Dropdown Menu -->
        <div class="dropdown-menu" *ngIf="isDropdownOpen">
          <a routerLink="/profile" class="dropdown-item" (click)="isDropdownOpen = false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Mi Perfil</span>
          </a>
          <a *ngIf="user.role === 'SYSADMIN'" routerLink="/sysadmin/users" class="dropdown-item" (click)="isDropdownOpen = false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <span>Gestión de Usuarios</span>
          </a>

          <!-- Selector de roles simulados (solo visible si el rol real es SYSADMIN o ADMIN) -->
          <ng-container *ngIf="authService.isRealSysadmin() || authService.isRealAdmin()">
            <div class="dropdown-divider"></div>
            <div class="dropdown-header">Vista Simulada</div>

            <!-- Opciones para SYSADMIN -->
            <ng-container *ngIf="authService.isRealSysadmin()">
              <button class="dropdown-item simulated-role-btn"
                      [class.active]="authService.simulatedRole() === null"
                      (click)="selectRole(null)">
                <span class="role-dot sysadmin"></span>
                <span>Sysadmin (Real)</span>
              </button>
              <button class="dropdown-item simulated-role-btn"
                      [class.active]="authService.simulatedRole() === 'ADMIN'"
                      (click)="selectRole('ADMIN')">
                <span class="role-dot admin"></span>
                <span>Profesor</span>
              </button>
              <button class="dropdown-item simulated-role-btn"
                      [class.active]="authService.simulatedRole() === 'STUDENT'"
                      (click)="selectRole('STUDENT')">
                <span class="role-dot student"></span>
                <span>Alumno</span>
              </button>
            </ng-container>

            <!-- Opciones para ADMIN -->
            <ng-container *ngIf="authService.isRealAdmin()">
              <button class="dropdown-item simulated-role-btn"
                      [class.active]="authService.simulatedRole() === null"
                      (click)="selectRole(null)">
                <span class="role-dot admin"></span>
                <span>Profesor (Real)</span>
              </button>
              <button class="dropdown-item simulated-role-btn"
                      [class.active]="authService.simulatedRole() === 'STUDENT'"
                      (click)="selectRole('STUDENT')">
                <span class="role-dot student"></span>
                <span>Alumno</span>
              </button>
            </ng-container>
          </ng-container>

          <div class="dropdown-divider"></div>
          <button (click)="confirmLogout()" class="dropdown-item text-danger">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>Cerrar Sesión</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- Logout Confirmation Modal -->
<div class="modal-overlay" *ngIf="showLogoutModal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-icon text-danger">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </div>
      <h3 class="modal-title">Cerrar Sesión</h3>
    </div>
    <p class="modal-message">¿Estás seguro que deseas cerrar sesión y salir de la plataforma?</p>
    <div class="modal-actions">
      <button class="btn-cancel" (click)="cancelLogout()">Cancelar</button>
      <button class="btn-confirm" (click)="executeLogout()">Sí, cerrar sesión</button>
    </div>
  </div>
</div>
