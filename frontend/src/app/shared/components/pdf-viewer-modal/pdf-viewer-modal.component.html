<div class="modal-backdrop animate-fade-in" (click)="onClose()">
  <div class="modal-card pdf-modal-card glass-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3 class="modal-title-text">{{ title }}</h3>
      <button (click)="onClose()" class="btn-close">&times;</button>
    </div>
    <div class="modal-body pdf-modal-body">
      <iframe *ngIf="pdfUrl" [src]="pdfUrl" width="100%" height="100%" class="pdf-iframe-view"></iframe>
      <div *ngIf="!pdfUrl" class="pdf-loading-container">
        <div class="pdf-spinner"></div>
        <p class="pdf-loading-text">Cargando previsualización del documento...</p>
      </div>
    </div>
    <div class="modal-footer pdf-modal-footer">
      <button (click)="onDownload()" class="btn-accent" style="display: inline-flex; align-items: center; gap: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        <span>Descargar PDF</span>
      </button>
      <button (click)="onClose()" class="btn-outline" style="margin-left: 10px;">Cerrar</button>
    </div>
  </div>
</div>
